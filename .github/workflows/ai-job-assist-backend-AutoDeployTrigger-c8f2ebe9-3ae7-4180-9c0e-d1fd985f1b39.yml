name: Trigger auto deployment for ai-job-assist-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/ai-job-assist-backend-AutoDeployTrigger-c8f2ebe9-3ae7-4180-9c0e-d1fd985f1b39.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AIJOBASSISTBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AIJOBASSISTBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AIJOBASSISTBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.AIJOBASSISTBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AIJOBASSISTBACKEND_REGISTRY_PASSWORD }}
          containerAppName: ai-job-assist-backend
          resourceGroup: rg-job-assist
          imageToBuild: ghcr.io/ai-job-assist-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


