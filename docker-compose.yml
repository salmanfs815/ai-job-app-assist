# Local stack. Works with no .env at all: mock LLM output, in-memory storage.
services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      AUTH_MODE: ${AUTH_MODE:-dev}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      PERSISTENCE_ENABLED: ${PERSISTENCE_ENABLED:-false}
      COSMOS_ENDPOINT: ${COSMOS_ENDPOINT:-}
      COSMOS_KEY: ${COSMOS_KEY:-}
      COSMOS_DATABASE_NAME: ${COSMOS_DATABASE_NAME:-jobassist}
      COSMOS_CONTAINER_NAME: ${COSMOS_CONTAINER_NAME:-results}
      # No reverse proxy locally: use the socket address for rate limiting.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
